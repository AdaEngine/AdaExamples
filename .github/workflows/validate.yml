name: Validate catalog and samples

on:
  pull_request:
  push:
    branches: [main]

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate catalog
        run: python3 scripts/validate_catalog.py

  swift-samples:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        sample: [Fold, StarQuest]
    steps:
      - uses: actions/checkout@v4
      - name: Test sample
        run: swift test --package-path "Samples/${{ matrix.sample }}" --scratch-path "/tmp/adaexamples-${{ matrix.sample }}"
